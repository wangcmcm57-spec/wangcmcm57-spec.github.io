<style>
  @font-face {
    font-family: "Card Handwriting";
    src: url("./card-b403d2fdb3ab.woff2") format("woff2");
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }
  :root {
    color-scheme: light;
    --ink: #253c68;
    --paper: #fff0d5;
    --berry: #bf5269;
    --gold: #d3912b;
    --grain: url("./card-8203eb090100.png");
    --handwriting: "Card Handwriting", "Kaiti SC", STKaiti, KaiTi, serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    min-width: 270px;
    color: var(--ink);
    background: #a5dce4;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  ::selection { color: #fff4da; background: #9a4360; }
  .landscape, .fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .landscape img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
    display: block;
  }
  .experience {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100svh;
    padding: 12px 0 22px;
    padding: max(12px, env(safe-area-inset-top)) 0 max(22px, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  .scene {
    width: min(100%, 1120px);
    height: clamp(315px, 77vh, 718px);
    height: clamp(315px, 77svh, 718px);
    position: relative;
    isolation: isolate;
  }
  .startup {
    position: absolute;
    top: 54%;
    left: 50%;
    width: calc(100% - 48px);
    max-width: 548px;
    transform: translate(-50%, -29%);
    text-align: center;
  }
  .startup img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 13px;
    background: #fff1d7;
    box-shadow: 0 6px 18px #29496742;
  }
  .startup p {
    display: inline-block;
    margin: 14px 0 0;
    padding: 5px 12px;
    border-radius: 16px;
    background: #fff1d7;
    font-size: 14px;
  }
  .experience:not([data-ready]) .rig,
  .experience:not([data-ready]) .controls { visibility: hidden; }
  .experience[data-ready] .startup { display: none; }
  .rig {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    transform: scale(var(--fit, .4));
  }
  .table-shadow {
    position: absolute;
    width: 710px;
    height: 110px;
    left: -355px;
    top: 0;
    border-radius: 50%;
    background: radial-gradient(ellipse, #2b53714b 0%, #45658026 43%, #56768d00 72%);
    transform-origin: center top;
    pointer-events: none;
  }
  .perspective {
    position: absolute;
    inset: 0;
    perspective: 1840px;
    perspective-origin: 0 0;
  }
  .world, .base, .lid, .cutout, .paper-stop {
    position: absolute;
    transform-style: preserve-3d;
  }
  .world { width: 0; height: 0; }
  .base, .lid {
    width: 690px;
    height: 460px;
    left: -345px;
    top: -460px;
    transform-origin: 50% 100%;
  }
  .base { transform: rotateX(-99deg); }
  .paper {
    position: absolute;
    inset: 0;
    border-radius: 19px 19px 5px 5px;
    background: var(--grain), #fff0d7;
    overflow: hidden;
  }
  .sheet-print {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
    pointer-events: none;
  }
  .back-print {
    transform: translateZ(1.1px);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    box-shadow: 0 0 0 1.5px #e3cdac, 1px 3px 0 1px #c6a681;
  }
  .back-print::after, .inside::after {
    content: "";
    position: absolute;
    inset: auto 0 0;
    height: 29px;
    pointer-events: none;
    background: linear-gradient(0deg, #76533c3c, #93684e0b 39%, transparent);
  }
  .cover {
    appearance: none;
    border: 0;
    padding: 0;
    cursor: grab;
    touch-action: none;
    user-select: none;
    transform: rotateX(180deg) translateZ(1.1px);
    border-radius: 5px 5px 19px 19px;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    box-shadow: 0 0 0 1.3px #f8e4c3, 3px 4px 0 1px #c9ab85, 12px 17px 33px #3d46593b;
  }
  .cover:active { cursor: grabbing; }
  .cover:disabled { cursor: default; pointer-events: none; }
  .inside {
    transform: rotateX(180deg) translateZ(1.3px);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 5px 5px 19px 19px;
    color: #263c62;
    box-shadow: 0 0 0 1.2px #ecd6b6, 1px 4px 0 1px #bc9975, 7px 10px 15px #53647826;
    background:
      var(--grain),
      linear-gradient(165deg, #fae8ca, #fff1d7 55%, #f9e7c8);
  }
  .inside::after { inset: 0 0 auto; transform: scaleY(-1); height: 43px; }
  .print-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  .note {
    position: absolute;
    z-index: 1;
    left: 8%;
    right: 8%;
    top: 52%;
    margin: 0;
    text-align: center;
    font-family: var(--handwriting);
    font-weight: 400;
    font-size: 44px;
    line-height: 1;
    letter-spacing: .025em;
  }
  .note span { display: block; white-space: nowrap; }
  .note span:first-child { transform: rotate(-.6deg); }
  .note span:last-child { transform: rotate(.4deg); }
  .note em { color: #a5455e; font-style: normal; }
  .little-heart {
    width: 100px;
    height: 33px;
    position: absolute;
    top: 83%;
    left: calc(50% - 50px);
    color: var(--berry);
  }
  .foot-shadow {
    position: absolute;
    width: 200px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(ellipse, #68482762, #9a785f32 36%, #9a785f00 73%);
    pointer-events: none;
  }
  .shadow-couple { top: 83px; left: 221px; width: 260px; }
  .shadow-dog { top: 181px; left: 267px; width: 174px; }

  .cutout {
    top: 0;
    width: var(--width);
    left: calc(var(--x) - var(--width) / 2);
    transform-origin: center bottom;
    pointer-events: none;
  }
  .couple { --width: 405px; --x: -2px; }
  .dog { --width: 182px; --x: 6px; }
  .cutout .art, .cutout .edge, .paper-stop {
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .cutout .art {
    display: block;
    width: 100%;
    height: auto;
    position: relative;
    transform: translateZ(1px);
    filter: drop-shadow(5px 8px 5px #43311e2c);
  }
  .cutout .edge {
    position: absolute;
    inset: 0;
    width: 100%;
    transform: translate3d(1px, 1.5px, -2.4px);
    filter: brightness(.78) sepia(.19);
  }
  .paper-stop {
    bottom: -1px;
    width: 12%;
    height: 9%;
    border-radius: 6px 9px 1px 1px;
    background: var(--grain), linear-gradient(105deg, #dec29b, #f5e1ba);
    transform-origin: center bottom;
    transform: rotateY(39deg);
  }
  .stop-left { left: 4%; }
  .stop-right { right: 3%; transform: rotateY(-44deg); }

  .controls {
    min-height: 77px;
    padding: 2px 15px 0;
    text-align: center;
    position: relative;
    transform: translateY(-53px);
    transition: transform .8s cubic-bezier(.22,.65,.25,1);
  }
  .experience[data-open] .controls { transform: translateY(-38px); }
  .toggle {
    display: inline-flex;
    min-height: 48px;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: 0;
    border-radius: 30px;
    padding: 11px 22px;
    background: var(--ink);
    color: #fff1d7;
    font: 400 18px var(--handwriting);
    letter-spacing: .07em;
    cursor: pointer;
    box-shadow: 0 4px 9px #25456925;
    transition: background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .toggle svg { width: 16px; height: 16px; }
  .toggle[aria-expanded="true"] {
    color: var(--ink);
    background: #fff2dceF;
    box-shadow: inset 0 0 0 1px #455d7e64;
  }
  @media (hover: hover) {
    .toggle:hover { background: #385487; }
    .toggle[aria-expanded="true"]:hover { background: #fffaea; }
  }
  .music {
    position: absolute;
    top: 4px;
    left: calc(50% + 79px);
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: #fff2dceF;
    border: 1px solid #455d7e64;
    border-radius: 50%;
    color: var(--ink);
    cursor: pointer;
  }
  .music[hidden] { display: none; }
  .music svg { width: 19px; height: 19px; }
  .music .sound, .music[data-playing] .silent { display: none; }
  .music[data-playing] .sound { display: initial; }
  @media (hover: hover) {
    .music:hover { background: #fffaea; }
  }
  .toggle:focus-visible, .music:focus-visible { outline: 2px solid #923957; outline-offset: 5px; }
  .caption {
    display: table;
    margin: 9px auto 0;
    border-radius: 12px;
    padding: 3px 8px;
    background: #fffae9d9;
    font: 400 14px var(--handwriting);
    letter-spacing: .06em;
    color: #3b536f;
  }
  .experience[data-open] .caption { display: none; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  @media (max-width: 640px) {
    .scene {
      height: clamp(275px, 56vh, 500px);
      height: clamp(275px, 56svh, 500px);
    }
    .landscape img { object-position: right bottom; }
    .controls { transform: translateY(-63px); }
    .experience[data-open] .controls { transform: translateY(-45px); }
  }
  @media (max-height: 530px) and (orientation: landscape) {
    .experience { padding-top: 5px; padding-bottom: 8px; }
    .scene {
      height: max(240px, calc(100vh - 91px));
      height: max(240px, calc(100svh - 91px));
    }
    .caption { margin-top: 6px; }
    .controls, .experience[data-open] .controls { transform: translateY(-6px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; }
  }
</style>
</head>
<body>
<picture class="landscape" aria-hidden="true">
  <source media="(max-width: 640px) and (orientation: portrait)" srcset="./card-0942a8083352.webp">
  <img src="./card-f6a0806bfe07.webp" alt="">
</picture>
<canvas class="fireworks" aria-hidden="true"></canvas>
<main class="experience">
  <h1 class="sr-only">生日快乐</h1>
  <div class="scene" id="birthday-card">
    <div class="startup">
      <img src="./card-4c1d42c2de94.webp" alt="生日贺卡封面" width="690" height="460" fetchpriority="high">
      <p id="startup-message" role="status">正在准备贺卡…</p>
    </div>
    <div class="rig" aria-hidden="true">
      <div class="table-shadow"></div>
      <div class="perspective">
        <div class="world">
          <div class="base">
            <div class="paper inside">
              <div class="foot-shadow shadow-couple"></div>
              <div class="foot-shadow shadow-dog"></div>
              <svg class="print-frame" viewBox="0 0 690 460" aria-hidden="true">
                <defs>
                  <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(32)">
                    <path d="M2 0V8 M5 0V8" stroke="#b65268" stroke-width="1.45" opacity=".77"/>
                  </pattern>
                </defs>
                <rect x="19" y="17" width="652" height="424" rx="25" fill="none" stroke="url(#hatch)" stroke-width="13"/>
                <rect x="28" y="26" width="634" height="406" rx="19" fill="none" stroke="#ba5970" stroke-width="1.15" opacity=".74"/>
                <g fill="none" stroke="#d49a32" stroke-width="4.4" stroke-linecap="round">
                  <path d="M54 48l1 32m-16-16 31-1m-26-9 21 20m0-21L45 75"/>
                  <path d="M635 48l1 32m-16-16 31-1m-26-9 21 20m0-21-20 22"/>
                  <path d="M56 381l1 32m-16-16 31-1m-26-9 21 20m0-21-20 22"/>

              </svg>
              <p class="note"><span>去成为想成为的大人，</span><span>不被束缚，不迎合期望，</span><span>自由又自在，<em>生日快乐！</em></span></p>
              <svg class="little-heart" viewBox="0 0 100 33" aria-hidden="true">
                <path d="M50 28C46 25 33 16 36 9c3-7 11-7 14 0 4-7 12-7 15 0 3 7-10 16-15 19Z" fill="currentColor"/>
                <path d="m24 10-10-4m9 13-12 1m65-10 10-4m-9 13 12 1" fill="none" stroke="#cc8b2f" stroke-width="3" stroke-linecap="round"/>

          <div class="lid">

  <div class="controls">

<script>
  const experience = document.querySelector(".experience");
  const scene = document.querySelector(".scene");
  const rig = document.querySelector(".rig");
  const world = document.querySelector(".world");
  const shadow = document.querySelector(".table-shadow");
  const lid = document.querySelector(".lid");
  const sky = document.querySelector(".fireworks");
  const sparks = sky.getContext("2d");
  const cover = document.querySelector(".cover");
  const couple = document.querySelector(".couple");
  const dog = document.querySelector(".dog");
  const toggle = document.querySelector(".toggle");
  const greeting = document.querySelector("#greeting");
  const song = document.querySelector("#birthday-song");
  const music = document.querySelector(".music");
  const motion = matchMedia("(prefers-reduced-motion: reduce)");
  const baseAngle = -99;
  const pageDepth = 460;
  const perspective = 1840;
  const narrowScreen = matchMedia("(max-width: 640px)");

  for (const art of document.querySelectorAll(".art")) {
    const edge = art.cloneNode();
    edge.className = "edge";
    edge.removeAttribute("width");
    edge.removeAttribute("height");
    art.before(edge);
  }

  let progress = 0;
  let isOpen = false;
  let frame = 0;
  let fireworksFrame = 0;
  let skyWidth = 0;
  let skyHeight = 0;
  let drag = null;
  let draggedCover = false;

  function smooth(value) {
    const t = Math.max(0, Math.min(1, value));
    return t * t * (3 - 2 * t);
  }

  function placeCutout(piece, amount, distance) {
    const rise = smooth(amount);
    const rebound = Math.sin(Math.PI * rise) * Math.pow(rise, 3) * 32;
    const radians = baseAngle * Math.PI / 180;
    const height = -distance * Math.cos(radians) + 1.7 * Math.sin(radians);
    const depth = -distance * Math.sin(radians) - 1.7 * Math.cos(radians);
    piece.style.visibility = rise > 0 ? "visible" : "hidden";
    piece.style.transform =
      `translate3d(0, ${height}px, ${depth}px) translateY(-100%) rotateX(${baseAngle * (1 - rise) + rebound}deg)`;
  }

  function paint(value) {
    const lift = smooth(value / .9);
    const camera = smooth(value);
    const settling = 4.5 * Math.sin(Math.PI * smooth((value - .70) / .30));
    const yaw = -1.8 + 1.1 * camera;
    const pitch = -46 + (narrowScreen.matches ? 21 : 25) * camera;

    // Keep the projected front edge of the bottom sheet under the viewer.
    const tableAngle = (baseAngle + pitch) * Math.PI / 180;
    const frontY = -pageDepth * Math.cos(tableAngle);
    const frontZ = -pageDepth * Math.sin(tableAngle);
    const hingeY = (352 - 15 * camera) * (1 - frontZ / perspective) - frontY;
    world.style.transform = `translateY(${hingeY}px) rotateX(${pitch}deg) rotateY(${yaw}deg)`;
    lid.style.transform = `rotateX(${baseAngle + 104 * lift + settling}deg) translateZ(-4px)`;
    shadow.style.transform = `translateY(${hingeY + 185 - 110 * camera}px) scale(1.02, ${2.85 - .6 * camera})`;
    shadow.style.opacity = .81 + .15 * camera;

    placeCutout(couple, (value - .27) / .52, 83);
    placeCutout(dog, (value - .40) / .52, 196);
  }

  function resizeSky() {
    if (!sparks) return;
    skyWidth = sky.clientWidth;
    skyHeight = sky.clientHeight;
    const density = Math.min(2, window.devicePixelRatio || 1);
    sky.width = Math.round(skyWidth * density);
    sky.height = Math.round(skyHeight * density);
    sparks.setTransform(density, 0, 0, density, 0, 0);
    sparks.lineCap = "round";
  }

  function stopFireworks() {
    cancelAnimationFrame(fireworksFrame);
    if (sparks) sparks.clearRect(0, 0, skyWidth, skyHeight);
  }

  function strokeSpark(fromX, fromY, toX, toY, color, width, opacity) {
    sparks.globalAlpha = opacity;
    sparks.strokeStyle = color;
    sparks.lineWidth = width;
    sparks.beginPath();
    sparks.moveTo(fromX, fromY);
    sparks.lineTo(toX, toY);
    sparks.stroke();
  }

  function fireFireworks() {
    if (!sparks) return;
    stopFireworks();
    const narrow = narrowScreen.matches;
    const launchPlan = narrow ? [
      [.22, .16, .32, 1.06, 0], [.79, .22, .51, 1, 1],
      [.52, .115, .82, .82, 2], [.13, .32, 1.10, .76, 3], [.88, .34, 1.32, .83, 0],
    ] : [
      [.24, .29, .35, 1.09, 0], [.77, .25, .53, 1.14, 1],
      [.48, .115, .83, .88, 2], [.16, .44, 1.12, .81, 3], [.87, .38, 1.37, .88, 0],
    ];
    const palettes = [
      ["#b83962", "#ffbad6"], ["#b16a15", "#ffe9a1"],
      ["#6845a4", "#e6d3ff"], ["#216887", "#b4f1ed"],
    ];
    const shells = launchPlan.map(([x, y, delay, scale, palette]) => ({
      x, y, delay, scale,
      ink: palettes[palette][0],
      light: palettes[palette][1],
      rays: Array.from({ length: 52 }, (_, index) => {
        const angle = (index + Math.random() * .62) * Math.PI * 2 / 52;
        const speed = .63 + Math.random() * .51;
        return { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed,
          twinkle: Math.random() * 20, life: .93 + Math.random() * .65 };
      }),
    }));

    function drawShell(shell, t) {
      const x = shell.x * skyWidth;
      const y = shell.y * skyHeight;
      if (t < 0) {
        const flight = Math.max(0, (t + .42) / .42);
        const tail = Math.max(0, flight - .16);
        const startX = x + (x < skyWidth / 2 ? .075 : -.075) * skyWidth;
        const startY = skyHeight * .77;
        const track = p => [startX + (x - startX) * p, startY + (y - startY) * p];
        if (flight > 0) {
          strokeSpark(...track(tail), ...track(flight), shell.ink, 4.2, flight * .63);
          strokeSpark(...track(tail), ...track(flight), "#fff3cb", 1.7, flight);
        }
        return;
      }
      const radius = (narrow ? skyWidth * .27 : Math.min(177, skyWidth * .126)) * shell.scale;
      if (t < .17) {
        const flash = 1 - t / .17;
        sparks.globalAlpha = flash * .85;
        sparks.fillStyle = "#fff5cf";
        sparks.beginPath();
        sparks.arc(x, y, 5 + (1 - flash) * 16, 0, Math.PI * 2);
        sparks.fill();
      }
      for (const ray of shell.rays) {
        if (t >= ray.life) continue;
        const travel = 1 - Math.exp(-3.65 * t);
        const tailTime = Math.max(0, t - .115);
        const tailTravel = 1 - Math.exp(-3.65 * tailTime);
        const gravity = 31 + radius * .19;
        const headX = x + ray.x * radius * travel;
        const headY = y + ray.y * radius * travel + gravity * t * t;
        const tailX = x + ray.x * radius * tailTravel;
        const tailY = y + ray.y * radius * tailTravel + gravity * tailTime * tailTime;
        const fade = Math.pow(1 - t / ray.life, .68);
        const glint = .77 + Math.sin(t * 35 + ray.twinkle) * .22;
        strokeSpark(tailX, tailY, headX, headY, shell.ink, 3.25 * fade + .55, fade * glint);
        strokeSpark(tailX, tailY, headX, headY, shell.light, 1.65 * fade + .3, fade * glint);
        if (glint > .78) {
          sparks.globalAlpha = fade;
          sparks.fillStyle = "#fff5d7";
          sparks.fillRect(headX - 1.2, headY - 1.2, 2.4, 2.4);
        }
      }
    }

    const start = performance.now();
    function draw(now) {
      const elapsed = (now - start) / 1000;
      sparks.clearRect(0, 0, skyWidth, skyHeight);
      for (const shell of shells) drawShell(shell, elapsed - shell.delay);
      sparks.globalAlpha = 1;
      if (elapsed < 3) fireworksFrame = requestAnimationFrame(draw);
    }
    fireworksFrame = requestAnimationFrame(draw);
  }

  function syncMusicButton() {
    const playing = !song.paused && !song.ended;
    music.toggleAttribute("data-playing", playing);
    music.setAttribute("aria-label", playing ? "暂停生日歌" : "播放生日歌");
  }

  function playSong() {
    song.play().catch(syncMusicButton);
  }

  function changeState(next) {
    isOpen = next;
    experience.toggleAttribute("data-open", next);
    toggle.setAttribute("aria-expanded", next);
    toggle.firstElementChild.textContent = next ? "合上贺卡" : "打开贺卡";
    music.hidden = !next;
    if (next) {
      song.currentTime = 0;
      playSong();
    } else {
      song.pause();
      stopFireworks();
    }
    greeting.hidden = !next;
    cover.disabled = next;
    cancelAnimationFrame(frame);

    const from = progress;
    const target = next ? 1 : 0;
    const duration = (next ? 930 : 690) * Math.abs(target - from);
    if (motion.matches || duration < 16) {
      progress = target;
      paint(progress);
      return;
    }

    const start = performance.now();
    let celebrated = false;
    function animate(now) {
      const elapsed = Math.max(0, Math.min(1, (now - start) / duration));
      progress = from + (target - from) * elapsed;
      paint(progress);
      if (next && progress >= .68 && !celebrated) {
        celebrated = true;
        fireFireworks();
      }
      if (elapsed < 1) frame = requestAnimationFrame(animate);
    }
    frame = requestAnimationFrame(animate);
  }

  function fit() {
    const widthFit = (scene.clientWidth - 22) / 897;
    const heightFit = (scene.clientHeight - 8) / 881;
    rig.style.setProperty("--fit", Math.min(widthFit, heightFit));
    paint(progress);
  }

  song.addEventListener("play", syncMusicButton);
  song.addEventListener("pause", syncMusicButton);
  song.addEventListener("ended", syncMusicButton);
  music.addEventListener("click", () => {
    if (song.paused || song.ended) playSong();
    else song.pause();
  });
  toggle.addEventListener("click", () => changeState(!isOpen));
  function openFromCover() {
    toggle.focus({ preventScroll: true });
    changeState(true);
  }

  cover.addEventListener("click", () => {
    if (!draggedCover) openFromCover();
  });
  cover.addEventListener("pointerdown", event => {
    if (event.button !== 0 || drag) return;
    draggedCover = false;
    drag = { id: event.pointerId, y: event.clientY, origin: progress };
    cover.setPointerCapture(event.pointerId);
  });
  cover.addEventListener("pointermove", event => {
    if (!drag || drag.id !== event.pointerId) return;
    const distance = drag.y - event.clientY;
    if (distance < 7 && !draggedCover) return;
    draggedCover = true;
    if (motion.matches) return;
    cancelAnimationFrame(frame);
    progress = Math.min(.92, Math.max(0, drag.origin + distance / (scene.clientHeight * .43)));
    paint(progress);
  });
  cover.addEventListener("pointerup", event => {
    if (!drag || drag.id !== event.pointerId) return;
    const distance = drag.y - event.clientY;
    drag = null;
    if (!draggedCover) return;
    if (distance >= 27) openFromCover();
    else changeState(false);
  });
  cover.addEventListener("pointercancel", event => {
    if (!drag || drag.id !== event.pointerId) return;
    drag = null;
    if (draggedCover) changeState(false);
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && isOpen) changeState(false);
  });
  function layout() {
    resizeSky();
    fit();
  }

  window.addEventListener("resize", layout);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);
  if (typeof ResizeObserver === "function") new ResizeObserver(fit).observe(scene);
  layout();

  const cardImages = Array.from(rig.querySelectorAll(".sheet-print, .art"));
  Promise.all(cardImages.map(image => image.complete ? Promise.resolve(image.naturalWidth > 0) :
    new Promise(resolve => {
      image.addEventListener("load", () => resolve(true), { once: true });
      image.addEventListener("error", () => resolve(false), { once: true });
    })
  )).then(results => {
    if (results.every(Boolean)) experience.setAttribute("data-ready", "");
    else document.querySelector("#startup-message").textContent = "贺卡图片加载失败，请刷新再试";
  });
</script>
</body>
</html>
